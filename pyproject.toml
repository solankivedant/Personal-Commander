[project]
name = "munshiji"
version = "0.1.0"
description = "Local-first, wake-word-activated voice assistant for Windows with native Hindi and Gujarati support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Munshiji" }]

# Dependencies are added incrementally as each roadmap phase (docs/ROADMAP.md)
# is implemented — see munshiji-full-report.md §4 for the full researched
# stack and licensing notes before adding anything here.
dependencies = [
    # Phase 0 — benchmarking (scripts/benchmark.py)
    "faster-whisper>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
munshiji = "munshiji.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshiji"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
