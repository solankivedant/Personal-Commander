[project]
name = "munshiji"
version = "0.1.0"
description = "Local-first, wake-word-activated voice assistant for Windows with native Hindi and Gujarati support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Munshiji" }]

# Dependencies are added incrementally as each roadmap phase (docs/ROADMAP.md)
# is implemented — see munshiji-full-report.md §4 for the full researched
# stack and licensing notes before adding anything here.
dependencies = [
    # Phase 0 — benchmarking (scripts/benchmark.py)
    "faster-whisper>=1.0",
    "httpx>=0.27",
    # Phase 1 — voice loop (audio/, wake/, asr/, tts/)
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "silero-vad>=5.1",
    "openwakeword>=0.6",
    "keyboard>=0.13",
    "kokoro-onnx>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # ui/ — minimal status overlay only, pulled forward from Phase 8 by
    # explicit decision (see docs/ROADMAP.md); the full tray/dashboard/
    # onboarding wizard is still Phase 8.
    "pyside6>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-keyboard>=0.13",
]

[project.scripts]
munshiji = "munshiji.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munshiji"]

[tool.mypy]
strict = true
files = ["src"]

# No type stubs published for these — pin the list to what we actually use
# rather than a blanket ignore.
[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "faster_whisper",
    "openwakeword.*",
    "silero_vad",
    "kokoro_onnx",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
