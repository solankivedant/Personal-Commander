# Held-out paraphrase set — the *semantic* half of the golden suite.
#
# Why this file exists, separately from utterances.yaml:
#
# Every embedding-stage case in tests/golden/utterances.yaml is, by
# construction, a verbatim copy of a line in config/examples/*.jsonl. That
# makes it an excellent test of cascade *mechanics* (stage ordering,
# thresholding, confirm resolution, slot enrichment) and a worthless test of
# semantic recall: the query has an exact match in the index, so cosine
# similarity is 1.0 and any encoder — including tests/test_router.py's
# deliberately non-semantic `_fake_encoder` — scores 100%.
#
# So "the golden set passes with the real multilingual-e5-small" was not,
# on its own, evidence for the claim it was being used to support: that one
# shared example set generalizes across en/hi/gu because the encoder is
# multilingual (CLAUDE.md, .claude/rules/architecture-and-router.md §10.2).
#
# Every utterance below is deliberately NOT in config/examples/*.jsonl and
# NOT matchable by any config/intents/*.yaml grammar template — it can only
# be answered by Stage 2 actually generalizing. tests/test_router.py asserts
# that non-membership rather than trusting this comment, so a future edit
# that "fixes" a failing case by pasting it into the example set fails
# loudly instead of quietly turning this file back into utterances.yaml.
#
# Graded only against the real encoder (MUNSHIJI_GOLDEN_REAL_ENCODER=1).
# Grading these with the fake encoder would measure nothing — it has no
# semantics to generalize with, by design.

# --- English ---
- text: "boot up spotify for me"
  lang: en
  expect_tool: open_app
  expect_args: {app: spotify}

- text: "I need excel running"
  lang: en
  expect_tool: open_app
  expect_args: {app: excel}

- text: "I am done with firefox"
  lang: en
  expect_tool: close_app
  expect_args: {app: firefox}

- text: "jump over to outlook"
  lang: en
  expect_tool: focus_app
  expect_args: {app: outlook}

- text: "tuck this window away"
  lang: en
  expect_tool: minimize_app

- text: "make this window fill the screen"
  lang: en
  expect_tool: maximize_app

- text: "give me a list of everything that is running"
  lang: en
  expect_tool: list_apps

- text: "I can barely hear this"
  lang: en
  expect_tool: set_volume
  expect_args: {direction: up}

- text: "drop the volume a little"
  lang: en
  expect_tool: set_volume
  expect_args: {direction: down}

- text: "no sound at all please"
  lang: en
  expect_tool: mute

- text: "this screen is way too bright"
  lang: en
  expect_tool: set_brightness
  expect_args: {direction: down}

- text: "how much juice is left"
  lang: en
  expect_tool: battery_status

- text: "I am stepping away, lock it"
  lang: en
  expect_tool: lock_screen

- text: "shut the whole machine down"
  lang: en
  expect_tool: shutdown
  expect_confirm: true

- text: "give it a fresh restart"
  lang: en
  expect_tool: restart
  expect_confirm: true

- text: "cut off the wifi"
  lang: en
  expect_tool: wifi_toggle
  expect_args: {state: "off"}

- text: "get bluetooth going"
  lang: en
  expect_tool: bluetooth_toggle
  expect_args: {state: "on"}

- text: "is the internet connected"
  lang: en
  expect_tool: wifi_status

