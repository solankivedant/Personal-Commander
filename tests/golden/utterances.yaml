# --- Still Phase 4 (escalation). Kept and xfailed, not deleted. ---
- text: "desktop par jitni PDF hai sab Documents me daal do"
  lang: hi
  expect_tool: move_files
  expect_stage: llm
  expect_confirm: true
  # Compositional: names the source, the filter and the destination in one
  # Hindi sentence. The grammar templates are English-only and the embedding
  # stage can supply the intent but not the three free-text slots, so this
  # needs escalation — not another template.

- text: "find the budget report from last week"
  lang: en
  expect_tool: find_file
  expect_stage: llm
  # "from last week" is a date range. router/slots.py has no date NER (spaCy
  # is deliberately still not a dependency), so the grammar match would put
  # the words into the filename pattern and find nothing. A date filter is
  # Phase 4/spaCy work, not a phrasing gap.

- text: "gayel mahina ni badhi PDF file shodhi aapo"
  lang: gu
  expect_tool: find_file
  expect_stage: llm
  # Same date-range problem as above, in Gujarati.
