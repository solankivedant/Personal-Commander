# Golden test set — the mandatory router regression check.
# Source format: munshiji-full-report.md §19.2.
# See .claude/rules/engineering-standards.md and .claude/skills/golden-test/
# CI gate: >=92% exact tool match, >=85% args match, 100% on expect_confirm cases.
#
# Phase 2 scope note: expect_stage: llm entries (the files.yaml intents —
# find_file/move_files/rename_file/delete_files) cannot pass yet, because
# Phase 4's LLM escalation (brain/) does not exist in this codebase. They are
# kept here (not deleted) and explicitly xfailed by tests/test_router.py's
# golden-set runner, which computes the CI gates only over entries whose
# expect_stage is grammar or embeddings — see that file's `run_golden_case`
# and `test_golden_set_phase2_gates` for the exact grading logic.
#
# Fixed during Phase 2 integration: apps.yaml's focus_app used to include a
# bare "go to {app}" alternative that collided with system.yaml's sleep
# ("go to sleep") — whichever intent's YAML file sorted first won arbitrarily.
# Resolved by dropping "go to" from focus_app (kept "switch to"/"focus [on]",
# which are unambiguous) rather than special-casing hassil's slot matching.
# The golden set below still uses "sleep now" rather than "go to sleep" for
# the sleep intent, which remains true regardless.
#
# Known remaining issue, not yet fixed: system.yaml's set_volume/
# set_brightness `{level}` wildcard is untyped, so it can greedily capture
# non-numeric text (e.g. a Hindi/Gujarati "how much is it" phrase) instead of
# falling through to get_volume/get_brightness's embedding examples — see
# docs/ROADMAP.md's Phase 2 notes. The two golden entries below that probe
# get_volume/get_brightness in hi/gu are phrased to avoid the collision
# rather than relying on a fix that doesn't exist yet.

