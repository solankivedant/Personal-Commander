# Golden test set — the mandatory router regression check.
# Source format: munshiji-full-report.md §19.2.
# See .claude/rules/engineering-standards.md and .claude/skills/golden-test/
# CI gate: >=92% exact tool match, >=85% args match, 100% on expect_confirm cases.
#
# Phase 3 update: the files.yaml intents now have real tools
# (src/munshiji/tools/files.py), so the concrete phrasings of them are graded
# like any other case. What stays `expect_stage: llm` is only what genuinely
# needs Phase 4 — a date range ("from last week", with no date NER in
# router/slots.py) and a compositional Hindi sentence that names source,
# filter and destination at once. Those are kept here, not deleted, and
# explicitly xfailed by tests/test_router.py's golden-set runner, which
# computes the CI gates only over entries whose expect_stage is grammar or
# embeddings.
#
# Note what the file-intent cases below do and don't assert. Grammar-stage
# cases carry full expect_args, because a template captures slots from the
# actual utterance. Embedding-stage cases assert the tool only and expect no
# args at all: router/slots.py deliberately drops query/source/destination at
# that stage rather than inheriting them from the nearest example (a
# nearest-neighbour hit is evidence about the intent, never about which files).
# The assistant asks for the missing detail instead of guessing — so "no args"
# is the correct expectation here, not a gap in the test.
#
# Fixed during Phase 2 integration: apps.yaml's focus_app used to include a
# bare "go to {app}" alternative that collided with system.yaml's sleep
# ("go to sleep") — whichever intent's YAML file sorted first won arbitrarily.
# Resolved by dropping "go to" from focus_app (kept "switch to"/"focus [on]",
# which are unambiguous) rather than special-casing hassil's slot matching.
# The golden set below still uses "sleep now" rather than "go to sleep" for
# the sleep intent, which remains true regardless.
#
# Also fixed (was the second known Phase 2 grammar issue): system.yaml's
# set_volume/set_brightness `{level}` was an untyped wildcard, so
# "volume {level}" greedily captured non-numeric text — "volume kitna hai"
# ("what's the volume") matched set_volume with level="kitna hai" at Stage 1,
# never reaching get_volume's embedding examples. `{level}` is now a hassil
# RangeSlotList bounded by config.router.grammar.level_range, and direction
# phrasings ("volume up") got their own {direction} TextSlotList instead of
# matching by accident as junk level captures. The hi/gu get_volume entries
# below are back to the natural phrasings that used to be blocked by this,
# and are the regression guard for it — if `{level}` ever loses its numeric
# constraint they fail immediately.

