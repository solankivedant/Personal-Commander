- text: "set volume to 50 percent"
  lang: en
  expect_tool: set_volume
  expect_args: {level: 50}
  expect_stage: grammar

- text: "set volume to fifty percent"
  lang: en
  expect_tool: set_volume
  expect_args: {level: 50}
  expect_stage: grammar
  # hassil's RangeSlotList resolves number *words*, not just digits, so
  # constraining {level} to a numeric range didn't cost this phrasing its
  # grammar-stage match.

- text: "volume up"
  lang: en
  expect_tool: set_volume
  expect_args: {direction: up}
  expect_stage: grammar
  # Matches via the {direction} TextSlotList. It used to "work" only as a
  # side effect of the untyped {level} wildcard capturing the word "up",
  # which meant set_volume received level="up".

