  expect_args: {}
  expect_stage: embeddings

- text: "abhi volume kya hai"
  lang: hi
  expect_tool: get_volume
  expect_args: {}
  expect_stage: embeddings
  # NOT "volume kitna hai" — diagnosed grammar-cascade bug, see header note
  # above: pre-existing set_volume template "volume {level}" is an untyped
  # wildcard and greedily swallows "kitna hai" as if it were a level value,
  # intercepting the utterance at grammar before embeddings ever sees it.
  # Real fix is out of scope here (system.yaml is "keep as-is" for this
  # change) — it needs {level} constrained to numeric text, e.g. hassil's
  # RangeSlotList, in a follow-up.

- text: "atyare volume shu che"
  lang: gu
  expect_tool: get_volume
  expect_args: {}
  expect_stage: embeddings
  # NOT "volume ketlu che" — same diagnosed bug as the hi case above.

