# Munshiji default configuration
# Source: munshiji-full-report.md §19.1. YAML only — no behaviour constants
# belong in source (see .claude/rules/engineering-standards.md).

app:
  name: munshiji
  language: auto              # auto | en | hi | gu
  first_run_wizard: true

audio:
  input_device: default
  sample_rate: 16000
  ring_buffer_s: 3.0

vad:
  model: silero_v5
  silence_ms: 300              # keep in the 280-320ms band, see docs/ARCHITECTURE.md
  min_speech_ms: 200

wake:
  engine: openwakeword
  phrase: hey_munshiji          # product identity — no trained model for this yet
  detector_model_id: hey_jarvis # actual openWakeWord model loaded until "hey
                                 # munshiji" is trained (needs synthetic-TTS
                                 # data + a training run, see docs/ROADMAP.md
                                 # Phase 1 note); push-to-talk covers the gap
  threshold: 0.5
  debounce_ms: 1500
  hotkey: ctrl+alt+space        # always ship push-to-talk alongside wake word

asr:
  engine: faster-whisper
  model: small
  compute_type: int8
  backend: openvino             # fallback: ctranslate2-cpu
  # device: GPU is not optional — Phase 0 measured on the actual target
  # hardware (docs/PHASE-0-RESULTS.md): OpenVINO IR on CPU gave NO speedup
  # over the plain ctranslate2 CPU backend (~2.9s, fails the 600ms gate).
  # Explicitly targeting the Iris Xe iGPU (device: GPU) cut that to ~850ms
  # (3.4x). Still short of the gate as of this measurement — INT8
  # quantization of the OpenVINO IR is the next untried lever, see the
  # results doc before changing this default.
  device: GPU                   # fallback: CPU (measured much slower, avoid)
  initial_prompt: "Chrome open karo. Volume thoda kam karo."

router:
  grammar:
    enabled: true
    dirs: [config/intents]
  embeddings:
    enabled: true
    model: multilingual-e5-small
    threshold: 0.75
    examples: config/examples
  teach_mode: true

llm:
  enabled: true
  provider: ollama
  model: qwen2.5:3b-instruct-q4_K_M   # pin by digest before shipping, not :latest
  keep_alive: -1
  history_turns: 4
  max_tools_in_context: 12
  max_iterations: 5
  temperature: 0.1

cloud:
  enabled: false
  escalate: ask                # never | ask | auto

tts:
  engine: kokoro
  voice: af_heart               # see data/models/kokoro/voices-v1.0.bin for
                                 # the full list ("default" is not a valid key)
  stream: true
  indic_engine: indictts

ui:
  overlay:
    enabled: true
    position: bottom_center       # bottom_center | bottom_left | bottom_right
    width_px: 320
    height_px: 56
    margin_px: 40                 # gap from the screen edge
    opacity: 0.92
    transcript_display_s: 3.0     # how long the last transcript stays shown
                                   # before the pill reverts to the state label

network:
  mode: hybrid                 # local_only | hybrid | full
  inbound: none                # none | tailscale
  allowlist:
    - api.open-meteo.com
    - gmail.googleapis.com
    - www.googleapis.com
  timeout_s: 10
  retries: 1

security:
  confirm_risk_tiers: [confirm]
  blocked_tools: [registry_write, format_disk, delete_permanent]
  speaker_verification: false
  undo_depth: 20

memory:
  facts_db: data/facts.sqlite
  documents:
    enabled: true
    path: data/chroma
    embed_model: nomic-embed-text
    watch_dirs: []

logging:
  level: INFO
  audit: data/audit.jsonl
  rotate_mb: 50
