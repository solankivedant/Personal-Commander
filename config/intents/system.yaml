# hassil grammar templates — Stage 1 of the router cascade.
# Source pattern: munshiji-full-report.md §3.2 L3.
# Deterministic, <10ms, zero RAM. Covers ~50% of daily commands when populated.
#
# Add a golden-test entry in tests/golden/utterances.yaml for every intent
# added here — see .claude/skills/new-tool/SKILL.md.

intents:
  set_volume:
    data:
      - sentences:
          - "set volume to {level} [percent]"
          - "volume {level}"
          - "[make it] (louder|quieter)"

  mute:
    data:
      - sentences:
          - "mute"
          - "mute [the] (volume|audio|sound)"
          - "[be] quiet"

  lock_screen:
    data:
      - sentences:
          - "lock [the] (screen|computer|laptop|pc)"

  sleep:
    data:
      - sentences:
          - "(go to sleep|sleep [now])"
          - "put [the] (computer|laptop|pc) to sleep"

  battery_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] battery [level|status]"
          - "how much battery [is left|do I have]"

  set_brightness:
    data:
      - sentences:
          - "set brightness to {level} [percent]"
          - "[make it|screen] (brighter|dimmer)"

  # --- New Phase 2 intents below (system.yaml). Grammar templates are
  # English-only, matching the existing style in this file — hi/gu coverage
  # for these comes from config/examples/{hi,gu}.jsonl, same division of
  # labour as the pre-existing intents above.

  get_volume:
    data:
      - sentences:
          - "(what's|what is|check) [the] [current] volume [level]"
          - "how loud is it"

  get_brightness:
    data:
      - sentences:
          - "(what's|what is|check) [the] [current] brightness [level]"
          - "how bright is [the] screen"

  shutdown:
    data:
      - sentences:
          - "shut down [the] (computer|laptop|pc)"
          - "shutdown [the] (computer|laptop|pc)"
          - "turn off [the] (computer|laptop|pc)"

  restart:
    data:
      - sentences:
          - "restart [the] (computer|laptop|pc)"
          - "reboot [the] (computer|laptop|pc)"

  wifi_toggle:
    data:
      - sentences:
          - "(turn|switch) [the] wifi {state}"
          - "wifi {state}"

  bluetooth_toggle:
    data:
      - sentences:
          - "(turn|switch) [the] bluetooth {state}"
          - "bluetooth {state}"

  wifi_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] wifi status"
          - "is wifi (on|off|connected)"

  bluetooth_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] bluetooth status"
          - "is bluetooth (on|off|connected)"
