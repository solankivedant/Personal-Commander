# hassil grammar templates — Stage 1 of the router cascade.
# Source pattern: munshiji-full-report.md §3.2 L3.
# Deterministic, <10ms, zero RAM. Covers ~50% of daily commands when populated.
#
# Add a golden-test entry in tests/golden/utterances.yaml for every intent
# added here — see .claude/skills/new-tool/SKILL.md.

intents:
  # {level} is constrained to a numeric RangeSlotList by router/grammar.py
  # (config.router.grammar.level_range), NOT a free wildcard. That is what
  # stops "volume {level}" from swallowing "volume kitna hai" / "volume
  # ketlu che" — those are get_volume questions and must reach the embedding
  # stage. Direction phrasings get their own {direction} slot for the same
  # reason: they used to only match by accident, as junk {level} captures.
  set_volume:
    data:
      - sentences:
          - "set volume to {level} [percent]"
          - "volume {level}"
          - "[turn|set] [the] volume {direction}"
          - "volume {direction}"
          - "[make it] (louder|quieter)"

  mute:
    data:
      - sentences:
          - "mute"
          - "mute [the] (volume|audio|sound)"
          - "[be] quiet"

  lock_screen:
    data:
      - sentences:
          - "lock [the|my] (screen|computer|laptop|pc)"

  sleep:
    data:
      - sentences:
          - "(go to sleep|sleep [now])"
          - "put [the] (computer|laptop|pc) to sleep"

  battery_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] battery [level|status]"
          - "how much battery [is left|do I have]"

  set_brightness:
    data:
      - sentences:
          - "set brightness to {level} [percent]"
          - "brightness {level}"
          - "[turn|set] [the] brightness {direction}"
          - "brightness {direction}"
          - "[make it|screen] (brighter|dimmer)"

  # --- New Phase 2 intents below (system.yaml). Grammar templates are
  # English-only, matching the existing style in this file — hi/gu coverage
  # for these comes from config/examples/{hi,gu}.jsonl, same division of
  # labour as the pre-existing intents above.

  get_volume:
    data:
      - sentences:
          - "(what's|what is|check) [the] [current] volume [level]"
          - "how loud is it"

  get_brightness:
    data:
      - sentences:
          - "(what's|what is|check) [the] [current] brightness [level]"
          - "how bright is [the] screen"

  shutdown:
    data:
      - sentences:
          - "shut down [the] (computer|laptop|pc)"
          - "shutdown [the] (computer|laptop|pc)"
          - "turn off [the] (computer|laptop|pc)"

  restart:
    data:
      - sentences:
          - "restart [the] (computer|laptop|pc)"
          - "reboot [the] (computer|laptop|pc)"

  wifi_toggle:
    data:
      - sentences:
          - "(turn|switch) [the] wifi {state}"
          - "wifi {state}"

  bluetooth_toggle:
    data:
      - sentences:
          - "(turn|switch) [the] bluetooth {state}"
          - "bluetooth {state}"

  wifi_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] wifi status"
          - "is wifi (on|off|connected)"

  bluetooth_status:
    data:
      - sentences:
          - "(what's|what is|check) [the] bluetooth status"
          - "is bluetooth (on|off|connected)"

  # --- Phase 3: undo. The safety net has to be reachable by voice, or the
  # Recycle Bin and the inverse-operation stack are only useful to someone
  # who already knows to go looking for them.
  undo_last:
    data:
      - sentences:
          - "undo [that|it|this]"
          - "undo [the] last (thing|action|change|one)"
          - "(take|put) that back"

  what_can_i_undo:
    data:
      - sentences:
          - "what (can|could) I undo"
          - "what would (undo|undoing) do"
