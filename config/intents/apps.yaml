# hassil grammar templates — application control intents.
# See config/intents/system.yaml for format notes.

intents:
  open_app:
    data:
      - sentences:
          - "open {app}"
          - "(launch|start|run) {app}"

  close_app:
    data:
      - sentences:
          - "close {app}"
          - "(quit|exit) {app}"

  focus_app:
    data:
      - sentences:
          - "(switch to|focus [on]) {app}"

  minimize_app:
    data:
      - sentences:
          - "minimize {app}"
          - "minimize [this|current] window"

  maximize_app:
    data:
      - sentences:
          - "maximize {app}"
          - "maximize [this|current] window"

  list_apps:
    data:
      - sentences:
          - "(what|which) apps are [open|running]"
          - "list [running|open] apps"
          - "show [me] [running|open] apps"
