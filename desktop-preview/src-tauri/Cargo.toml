[package]
name = "munshiji-preview"
version = "0.1.0"
description = "Munshiji Control Center — UI preview build (no voice/system control wired up yet)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "munshiji-preview"
path = "src/main.rs"
